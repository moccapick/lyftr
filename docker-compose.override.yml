# Lastes automatisk av `docker compose` sammen med docker-compose.yml.
# Legger Lyftr bak en Tailscale-node ("lyftr" i tailnettet) med gyldig HTTPS,
# og eksponerer samtidig http://localhost:8080 lokalt på Mac-en.
#
# Første gang: `docker compose logs tailscale` viser en login-URL — åpne den
# (eller sett TS_AUTHKEY i .env). Deretter: https://lyftr.<tailnet>.ts.net
#
# Tailscale-containeren deler nettverk med frontend (ikke omvendt), slik at
# nginx ikke mister lytteporten når tailscale restarter.
services:
  backend:
    build: ./backend
    image: lyftr-backend:local        # bygges fra forken, ikke upstream-image

  frontend:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: lyftr-frontend:local
    ports: !override
      - "127.0.0.1:${LOCAL_PORT:-8080}:80"   # kun lokal tilgang; alt annet via Tailscale
      - "127.0.0.1:8090:8090"                 # strava-mottakeren (deler nettverk med frontend)

  tailscale:
    image: tailscale/tailscale:latest
    restart: unless-stopped
    network_mode: service:frontend    # ser nginx på 127.0.0.1:80
    depends_on:
      frontend:
        condition: service_started
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
    volumes:
      - ./tailscale-state:/var/lib/tailscale
    # Egen oppstart i stedet for containerboot: containerboot avbryter `tailscale up`
    # etter 60 s uten auth-key, restarter og lager ny login-URL hver gang. Her venter
    # `tailscale up` til lenken i loggen er godkjent, og serve-oppsettet legges på etterpå.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        tailscaled --state=/var/lib/tailscale/tailscaled.state --tun=userspace-networking &
        until [ -S /var/run/tailscale/tailscaled.sock ]; do sleep 0.5; done
        tailscale up --hostname=lyftr --reset ${TS_AUTHKEY:+--authkey=$TS_AUTHKEY}
        tailscale serve --bg --https=443 http://127.0.0.1:80
        tailscale funnel --bg --https=8443 http://127.0.0.1:8090 || echo "Funnel ikke aktivert i tailnettet (kun nødvendig for Strava-webhook)"
        echo "Lyftr via Tailscale: https://$(tailscale status --json | sed -n 's/.*"DNSName": *"\([^"]*\)\.".*/\1/p' | head -1)"
        wait

  strava:
    build: ./integrations/strava
    image: lyftr-strava:local
    restart: unless-stopped
    network_mode: service:frontend    # lytter på 127.0.0.1:8090 i samme nettverk som tailscale
    depends_on:
      frontend:
        condition: service_started
    environment:
      - STRAVA_CLIENT_ID=${STRAVA_CLIENT_ID:-}
      - STRAVA_CLIENT_SECRET=${STRAVA_CLIENT_SECRET:-}
      - STRAVA_VERIFY_TOKEN=${STRAVA_VERIFY_TOKEN:-}
      - STRAVA_PUBLIC_URL=${STRAVA_PUBLIC_URL:-}
      - STRAVA_FIXTURE_DIR=${STRAVA_FIXTURE_DIR:-}   # sett til /app/fixtures for test uten Strava
    volumes:
      - ./data:/app/data
